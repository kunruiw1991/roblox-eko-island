<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>eko Beta Test</title>
  <link rel="icon" href="./favicon.ico" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="game-shell">
    <canvas id="game-canvas" aria-label="eko Beta Test 3D Hex Island"></canvas>

    <div id="hud-root">
      <!-- Top-Left: Roblox Translucent Topbar (Title, Presets, Settings, Audio, Tile Counter) -->
      <div id="top-left-hud">
        <div id="roblox-topbar">
          <div id="eko-title-pill" class="rbx-pill" title="eko Beta Test">
            <span class="eko-hex-dot"></span>
            <span class="eko-title-main">eko</span>
            <span class="eko-title-beta">Beta Test</span>
          </div>

          <button id="btn-presets" type="button" class="rbx-top-pill-btn" aria-label="Island Presets" title="Presets 1-8">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1.5" />
              <rect x="14" y="3" width="7" height="7" rx="1.5" />
              <rect x="3" y="14" width="7" height="7" rx="1.5" />
              <rect x="14" y="14" width="7" height="7" rx="1.5" />
            </svg>
            <span class="top-btn-txt">Presets</span>
          </button>

          <button id="btn-settings" type="button" class="rbx-top-btn" aria-label="Settings" title="Settings">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3.2" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
          </button>

          <button id="btn-audio" type="button" class="rbx-top-btn" aria-label="Toggle Audio" title="Music & SFX">
            <svg id="ico-audio-on" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
            </svg>
            <svg id="ico-audio-off" class="hidden" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
              <line x1="23" y1="9" x2="17" y2="15" />
              <line x1="17" y1="9" x2="23" y2="15" />
            </svg>
          </button>

          <div id="tile-counter-pill" class="rbx-pill" title="Island Tile Counter">
            <span id="tile-counter-text">0 / 1000</span>
          </div>
        </div>
      </div>

      <!-- Top-Right: Camera Pivot & Prominent WALK ISLAND / BUILD MODE Toggle Pill -->
      <div id="top-right-hud">
        <button id="btn-cam-reset" type="button" class="rbx-top-btn" aria-label="Reset Camera Pivot" title="Reset Camera View">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
            <circle cx="12" cy="13" r="4" />
          </svg>
        </button>

        <button id="btn-toggle-mode" type="button" class="mode-toggle-pill" aria-label="Switch Walk and Build Mode" title="Toggle Walk / Build [Tab]">
          <span id="mode-btn-icon" class="mode-ico">🚶</span>
          <span id="mode-btn-label" class="mode-lbl">WALK ISLAND</span>
        </button>
      </div>

      <!-- Center Toast Feedback -->
      <div id="center-alerts">
        <div id="toast-banner" class="rbx-panel hidden"></div>
      </div>

      <!-- Contextual Radial Menu (pops cleanly over selected placed props/cottages) -->
      <div id="radial-menu" class="hidden" role="menu" aria-label="Prop Radial Menu">
        <div class="radial-ring"></div>
        <div id="radial-label" class="radial-label">Cottage</div>
        <button id="btn-rad-close" type="button" class="radial-center-close" aria-label="Close Radial Menu">×</button>

        <button id="btn-rad-rotate" type="button" class="radial-btn rad-top" title="Rotate">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <polyline points="21 3 21 9 15 9" />
          </svg>
          <span>Rotate</span>
        </button>

        <button id="btn-rad-duplicate" type="button" class="radial-btn rad-right" title="Duplicate to neighbor hex">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2.5" />
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
          </svg>
          <span>Copy</span>
        </button>

        <button id="btn-rad-recolor" type="button" class="radial-btn rad-bottom" title="Recolor Pastel Palette">
          <span id="radial-swatch-dot" class="rad-swatch"></span>
          <span>Color</span>
        </button>

        <button id="btn-rad-delete" type="button" class="radial-btn rad-left rad-danger" title="Delete Prop">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
            <path d="M10 11v6" />
            <path d="M14 11v6" />
          </svg>
          <span>Delete</span>
        </button>
      </div>

      <!-- Bottom-Center Curved Horizontal Build Dock (10 tactile circular icons) -->
      <div id="build-dock-wrap">
        <div id="build-dock" class="curved-dock" role="toolbar" aria-label="Island Builder Tools">
          <button type="button" class="dock-btn active" data-tool="land" style="--arc:7px" title="Hex Land [1]">
            <span class="dock-key">1</span>
            <svg viewBox="0 0 36 36" class="dock-svg">
              <polygon points="18,4 30,11 30,25 18,32 6,25 6,11" fill="#92e25e" stroke="#4f8f34" stroke-width="2.2" />
              <polygon points="18,8 26,12.5 26,21.5 18,26 10,21.5 10,12.5" fill="#baf287" opacity="0.65" />
            </svg>
            <span class="dock-lbl">Land</span>
          </button>

          <button type="button" class="dock-btn" data-tool="raise" style="--arc:4px" title="Raise Cliff [2]">
            <span class="dock-key">2</span>
            <svg viewBox="0 0 36 36" class="dock-svg">
              <polygon points="18,5 29,11 29,24 18,30 7,24 7,11" fill="#e5d0ad" stroke="#997a52" stroke-width="2" />
              <polygon points="18,5 29,11 18,16 7,11" fill="#92e25e" />
              <path d="M18 19v7M14.5 22.5h7" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" />
            </svg>
            <span class="dock-lbl">Cliff +</span>
          </button>

          <button type="button" class="dock-btn" data-tool="lower" style="--arc:2px" title="Lower / Erase [3]">
            <span class="dock-key">3</span>
            <svg viewBox="0 0 36 36" class="dock-svg">
              <circle cx="18" cy="18" r="12" fill="#f87171" stroke="#b91c1c" stroke-width="2" />
              <path d="M12.5 18h11" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" />
            </svg>
            <span class="dock-lbl">Lower</span>
          </button>

          <button type="button" class="dock-btn" data-tool="pond" style="--arc:0px" title="Carve Pond [4]">
            <span class="dock-key">4</span>
            <svg viewBox="0 0 36 36" class="dock-svg">
              <path d="M18 5 C18 5 28 16 28 22.5 A10 10 0 1 1 8 22.5 C8 16 18 5 18 5 Z" fill="#38d9e8" stroke="#0e7490" stroke-width="2.2" />
              <path d="M13.5 22.5 A4.5 4.5 0 0 0 18 27" stroke="#e0fcff" stroke-width="2.2" stroke-linecap="round" fill="none" />
            </svg>
            <span class="dock-lbl">Pond</span>
          </button>

          <button type="button" class="dock-btn" data-tool="oak" style="--arc:-1px" title="Oak Tree [V]">
            <span class="dock-key">V</span>
            <svg viewBox="0 0 36 36" class="dock-svg">
              <rect x="15.5" y="21" width="5" height="10" rx="2" fill="#8b5d3b" />
              <circle cx="18" cy="14.5" r="8.5" fill="#79cf5b" stroke="#468c32" stroke-width="2" />
              <circle cx="13" cy="16" r="5" fill="#8ce26b" />
              <circle cx="23" cy="16" r="5" fill="#6cc04f" />
            </svg>
            <span class="dock-lbl">Oak</span>
          </button>

          <button type="button" class="dock-btn" data-tool="pine" style="--arc:-1px" title="Pine Tree [C]">
            <span class="dock-key">C</span>
            <svg viewBox="0 0 36 36" class="dock-svg">
              <rect x="15.8" y="24" width="4.4" height="7" rx="1.5" fill="#7d5235" />
              <polygon points="18,4 27,16 9,16" fill="#52b37c" stroke="#2d7a50" stroke-width="1.8" stroke-linejoin="round" />
              <polygon points="18,10 28.5,24 7.5,24" fill="#469e6c" stroke="#2d7a50" stroke-width="1.8" stroke-linejoin="round" />
            </svg>
            <span class="dock-lbl">Pine</span>
          </button>

          <button type="button" class="dock-btn" data-tool="bush" style="--arc:0px" title="Flowering Bush [7]">
            <span class="dock-key">7</span>
            <svg viewBox="0 0 36 36" class="dock-svg">
              <circle cx="13" cy="21" r="7" fill="#76cf58" stroke="#458a30" stroke-width="1.8" />
              <circle cx="23" cy="21" r="7" fill="#76cf58" stroke="#458a30" stroke-width="1.8" />
              <circle cx="18" cy="17.5" r="8" fill="#8ee05a" stroke="#458a30" stroke-width="1.8" />
              <circle cx="14" cy="15.5" r="2.5" fill="#ff8ec0" />
              <circle cx="21.5" cy="17" r="2.5" fill="#ffe066" />
              <circle cx="18" cy="22" r="2.3" fill="#ff8ec0" />
            </svg>
            <span class="dock-lbl">Bush</span>
          </button>

          <button type="button" class="dock-btn" data-tool="rock" style="--arc:2px" title="Boulder Rock [8]">
            <span class="dock-key">8</span>
            <svg viewBox="0 0 36 36" class="dock-svg">
              <polygon points="8,26 11,13 20,10 28,16 29,26" fill="#dcd3c5" stroke="#857b6c" stroke-width="2" stroke-linejoin="round" />
              <polygon points="11,13 20,10 23,18 13,20" fill="#efe9df" opacity="0.7" />
            </svg>
            <span class="dock-lbl">Rock</span>
          </button>

          <button type="button" class="dock-btn" data-tool="cottage" style="--arc:4px" title="Timber Cottage [9]">
            <span class="dock-key">9</span>
            <svg viewBox="0 0 36 36" class="dock-svg">
              <rect x="9" y="17" width="18" height="12" rx="1.5" fill="#faf2e1" stroke="#7c5234" stroke-width="2" />
              <polygon points="6,18 18,7 30,18" fill="#e2725b" stroke="#9b4331" stroke-width="2" stroke-linejoin="round" />
              <rect x="13" y="21.5" width="4.5" height="7.5" rx="1" fill="#8f5d3a" />
              <rect x="20" y="20.5" width="4.5" height="4.5" rx="0.8" fill="#ffe066" stroke="#7c5234" stroke-width="1.2" />
            </svg>
            <span class="dock-lbl">Cottage</span>
          </button>

          <button id="btn-undo" type="button" class="dock-btn dock-undo" style="--arc:7px" title="Undo [Z]">
            <span class="dock-key">Z</span>
            <svg viewBox="0 0 36 36" class="dock-svg">
              <path d="M13 13H22a7 7 0 1 1 0 14H15" fill="none" stroke="#f8fafc" stroke-width="2.8" stroke-linecap="round" />
              <polyline points="16,8 10,13 16,18" fill="none" stroke="#f8fafc" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="dock-lbl">Undo</span>
          </button>
        </div>
      </div>

      <!-- Desktop Walk Mode Subtle Hint -->
      <div id="walk-desktop-hint" class="rbx-panel hidden">
        WASD Walk · Space Jump · E Wave · Drag Look · Tab Build
      </div>

      <!-- Walk Mode Touch Controls (Auto-shown on iPad / touch devices in Walk Mode only!) -->
      <div id="touch-controls" class="hidden">
        <div id="touch-stick-zone" aria-label="Movement Thumbstick">
          <div id="touch-stick-base">
            <div id="touch-stick-knob"></div>
          </div>
        </div>
        <div id="touch-right-btns">
          <button id="btn-touch-wave" type="button" class="rbx-touch-btn rbx-touch-wave" aria-label="Wave Emote">
            <span>WAVE</span>
          </button>
          <button id="btn-touch-jump" type="button" class="rbx-touch-btn rbx-touch-jump" aria-label="Jump">
            <span>JUMP</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Modal Backdrop & Modals -->
    <div id="modal-backdrop" class="hidden">
      <!-- Presets 1-8 Modal -->
      <div id="modal-presets" class="rbx-modal rbx-panel hidden" role="dialog" aria-label="Island Presets">
        <div class="rbx-modal-head">
          <h2>Island Presets (1–8)</h2>
          <button type="button" class="rbx-modal-close" data-close-modal aria-label="Close">×</button>
        </div>
        <div id="presets-grid" class="presets-grid"></div>
      </div>

      <!-- Settings Modal -->
      <div id="modal-settings" class="rbx-modal rbx-panel hidden" role="dialog" aria-label="eko Settings">
        <div class="rbx-modal-head">
          <h2>eko Settings</h2>
          <button type="button" class="rbx-modal-close" data-close-modal aria-label="Close">×</button>
        </div>

        <div class="settings-tile-meter">
          <div class="tile-meter-head">
            <span>Island Tile Limit</span>
            <strong id="set-tile-count-val">0 / 1000</strong>
          </div>
          <div class="tile-meter-track">
            <div id="set-tile-bar-fill" class="tile-meter-fill"></div>
          </div>
        </div>

        <div class="settings-grid">
          <div class="set-row">
            <span>Rotation Snap</span>
            <button id="btn-set-snap" type="button" class="rbx-toggle-btn">60°</button>
          </div>
          <div class="set-row">
            <span>Random Prop Rotation</span>
            <button id="btn-set-rand-rot" type="button" class="rbx-toggle-btn on">ON</button>
          </div>
          <div class="set-row">
            <span>Wind Lines</span>
            <button id="btn-set-wind" type="button" class="rbx-toggle-btn on">ON</button>
          </div>
          <div class="set-row">
            <span>Sun Shadows</span>
            <button id="btn-set-shadows" type="button" class="rbx-toggle-btn on">ON</button>
          </div>
          <div class="set-row">
            <span>Drifting Clouds</span>
            <button id="btn-set-clouds" type="button" class="rbx-toggle-btn on">ON</button>
          </div>
          <div class="set-row">
            <span>Ambient Music</span>
            <button id="btn-set-music" type="button" class="rbx-toggle-btn on">ON</button>
          </div>
          <div class="set-row">
            <span>Marimba SFX</span>
            <button id="btn-set-sfx" type="button" class="rbx-toggle-btn on">ON</button>
          </div>
          <div class="set-row">
            <span>Touch Controls</span>
            <button id="btn-set-touch" type="button" class="rbx-toggle-btn">AUTO</button>
          </div>
        </div>

        <div class="settings-footer">
          <button id="btn-clear-island" type="button" class="set-action-btn danger">Clear Canvas</button>
          <button id="btn-reset-island" type="button" class="set-action-btn primary">Reset Starter Island</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
